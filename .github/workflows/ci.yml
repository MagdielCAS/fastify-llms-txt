name: CI

on:
  push:
    branches:
     - main
     - next
     - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    uses: fastify/workflows/.github/workflows/plugins-ci.yml@v5
    with:
      license-check: true
      # argparse, pulled in transitively by the optional js-yaml peer
      # dependency, is Python-2.0 (permissive, OSI-approved).
      license-check-allowed-additional: 'Python-2.0'
      lint: true
      # Matches "engines" in package.json; Node 20 reached end of life.
      node-versions: '["22", "24"]'
